name: Frontend CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name:  Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/event-marketplace/longicodeit/frontend:latest -f Dockerfile .

      - name: Push Docker image
        run: docker push ghcr.io/event-marketplace/longicodeit/frontend:latest
